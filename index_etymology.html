{word:"freelance",phonetic:"/\u02c8fri\u02d0l\u0251\u02d0ns/",meaning:"adj./n. \u81ea\u7531\u804c\u4e1a",sentence:"Many designers start their careers as freelance creatives.",cn_translation:"\u8bb8\u591a\u8bbe\u8ba1\u5e08\u4ee5\u81ea\u7531\u804c\u4e1a\u8005\u8eab\u4efd\u5f00\u542f\u804c\u4e1a\u751f\u6daf\u3002",category:"\u884c\u4e1a\u672f\u8bed\u4e0e\u804c\u4e1a\u53d1\u5c55\u7c7b",etymology:"自由长矛，中世纪骑士的自由职业。"},
{word:"agency",phonetic:"/\u02c8e\u026ad\u0292\u0259nsi/",meaning:"n. \u8bbe\u8ba1\u516c\u53f8",sentence:"Work at a design agency to gain diverse project experience.",cn_translation:"\u5728\u8bbe\u8ba1\u516c\u53f8\u5de5\u4f5c\u83b7\u5f97\u591a\u6837\u5316\u9879\u76ee\u7ecf\u9a8c\u3002",category:"\u884c\u4e1a\u672f\u8bed\u4e0e\u804c\u4e1a\u53d1\u5c55\u7c7b",etymology:"做事的地方，拉丁语的代理机构。"},
{word:"client",phonetic:"/\u02c8kla\u026a\u0259nt/",meaning:"n. \u5ba2\u6237",sentence:"Communicate effectively with clients to understand needs.",cn_translation:"\u4e0e\u5ba2\u6237\u6709\u6548\u6c9f\u901a\u4ee5\u4e86\u89e3\u9700\u6c42\u3002",category:"\u884c\u4e1a\u672f\u8bed\u4e0e\u804c\u4e1a\u53d1\u5c55\u7c7b",etymology:"依附别人的人，拉丁语的客户就是甲方爸爸。"}
];
let currentIndex=Math.floor(Math.random()*words.length);
let viewCounts=new Array(words.length).fill(0);
viewCounts[currentIndex]=1;
let dotPositions=[];
let hoveredDot=-1;

const STORAGE_KEY='motif_view_counts';
function saveCounts(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(viewCounts));}catch(e){}}
function loadCounts(){
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw)return false;
        const data=JSON.parse(raw);
        if(Array.isArray(data)&&data.length===words.length){
            viewCounts=data;
            return true;
        }
    }catch(e){}
    return false;
}
loadCounts();

function render(){
    viewCounts[currentIndex]++;
    saveCounts();
    const w=words[currentIndex];
    const card=document.getElementById('card');
    card.style.animation='none';
    card.offsetHeight;
    card.style.animation='slideIn 0.4s ease-out';
    document.getElementById('category').textContent=w.category;
    document.getElementById('word').textContent=w.word;
    document.getElementById('phonetic').textContent=w.phonetic;
    document.getElementById('meaning').textContent=w.meaning;
    document.getElementById('etymology').textContent=w.etymology || '';
    document.getElementById('sentence').textContent=w.sentence;
    document.getElementById('cnTranslation').textContent=w.cn_translation;
    document.getElementById('progress').textContent=(currentIndex+1)+' / '+words.length;
}

function speakCurrent(){speak(words[currentIndex].word);}
function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.92;window.speechSynthesis.speak(u);}

function randomWord(){
    let newIndex;
    do{newIndex=Math.floor(Math.random()*words.length);}while(newIndex===currentIndex&&words.length>1);
    currentIndex=newIndex;
    render();
}

function getColorByCount(count){
    if(count===0)return '#1a1a1a';
    const palette=['#1a1a1a','#264653','#2a9d8f','#e9c46a','#f4a261','#e76f51','#e63946','#f72585','#7209b7','#3a86ff'];
    const idx=Math.min(count-1,palette.length-1);
    return palette[idx];
}

function generateSmileyDots(){
    const dots=[];
    const cx=200,cy=200;
    // Face outline: 70 dots on circle r=150
    for(let i=0;i<70;i++){
        const a=(i/70)*Math.PI*2;
        dots.push({x:cx+Math.cos(a)*150,y:cy+Math.sin(a)*150});
    }
    // Left eye: 10 dots on circle r=22 at (155,160)
    for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2;
        dots.push({x:155+Math.cos(a)*22,y:160+Math.sin(a)*22});
    }
    // Right eye: 10 dots on circle r=22 at (245,160)
    for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2;
        dots.push({x:245+Math.cos(a)*22,y:160+Math.sin(a)*22});
    }
    // Smile: 10 dots on arc r=80 from 0.2π to 0.8π
    for(let i=0;i<10;i++){
        const a=0.2*Math.PI+(i/9)*0.6*Math.PI;
        dots.push({x:cx+Math.cos(a)*80,y:cy+Math.sin(a)*80});
    }
    return dots;
}

function drawSmiley(){
    const canvas=document.getElementById('smileyCanvas');
    const ctx=canvas.getContext('2d');
    const size=400;
    canvas.width=size;
    canvas.height=size;
    ctx.clearRect(0,0,size,size);

    for(let i=0;i<dotPositions.length;i++){
        const d=dotPositions[i];
        const color=getColorByCount(viewCounts[i]);
        ctx.beginPath();
        ctx.arc(d.x,d.y,i===hoveredDot?9:6,0,Math.PI*2);
        ctx.strokeStyle=color;
        ctx.lineWidth=i===hoveredDot?2.5:1.5;
        ctx.stroke();
    }
}

function showSmiley(){
    const card=document.getElementById('card');
    card.style.animation='slideOut 0.3s ease-in forwards';
    setTimeout(function(){
        document.getElementById('container').style.display='none';
        card.style.animation='';
        const sv=document.getElementById('smileyView');
        sv.classList.add('active');
        dotPositions=generateSmileyDots();
        drawSmiley();
    },300);
}

function hideSmiley(){
    document.getElementById('smileyView').classList.remove('active');
    document.getElementById('container').style.display='block';
    const card=document.getElementById('card');
    card.style.animation='none';
    card.offsetHeight;
    card.style.animation='slideIn 0.4s ease-out';
    render();
}

document.addEventListener('keydown',function(e){
    if(document.getElementById('smileyView').classList.contains('active'))return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft')randomWord();
});

let touchStartX=0,touchEndX=0;
const cardEl=document.getElementById('card');
cardEl.addEventListener('touchstart',function(e){touchStartX=e.changedTouches[0].screenX;},{passive:true});
cardEl.addEventListener('touchend',function(e){touchEndX=e.changedTouches[0].screenX;handleSwipe();},{passive:true});
function handleSwipe(){const threshold=50;if(touchEndX<touchStartX-threshold||touchEndX>touchStartX+threshold)randomWord();}

const smileyCanvas=document.getElementById('smileyCanvas');
smileyCanvas.addEventListener('click',function(e){
    const rect=smileyCanvas.getBoundingClientRect();
    const scale=400/rect.width;
    const mx=(e.clientX-rect.left)*scale;
    const my=(e.clientY-rect.top)*scale;
    for(let i=0;i<dotPositions.length;i++){
        const d=dotPositions[i];
        const dist=Math.sqrt((d.x-mx)**2+(d.y-my)**2);
        if(dist<14){
            currentIndex=i;
            hideSmiley();
            break;
        }
    }
});
smileyCanvas.addEventListener('mousemove',function(e){
    const rect=smileyCanvas.getBoundingClientRect();
    const scale=400/rect.width;
    const mx=(e.clientX-rect.left)*scale;
    const my=(e.clientY-rect.top)*scale;
    let found=-1;
    for(let i=0;i<dotPositions.length;i++){
        const d=dotPositions[i];
        if(Math.sqrt((d.x-mx)**2+(d.y-my)**2)<14){found=i;break;}
    }
    if(found!==hoveredDot){hoveredDot=found;drawSmiley();smileyCanvas.style.cursor=found>=0?'pointer':'default';}
});

render();
    </script>
</body>
</html>
